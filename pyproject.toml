[tool.poetry]
name = "equal-experts-votes-pipeline"
version = "0.1.0"
description = "Incremental JSONL votes ingestion and weekly outlier detection using Python and DuckDB"
authors = ["Assignment submission"]
readme = "README.md"
packages = [{ include = "votes_pipeline" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
duckdb = ">=1.2,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.scripts]
ingest-votes = "votes_pipeline.ingestion:main"
outliers = "votes_pipeline.outliers:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
